<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Dark SaaS Background Box (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bg-gradient)"/>
  
  <!-- Subtle top-left glassmorphism border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="url(#border-gradient)" stroke-width="8"/>

  <!-- Centered Korat Flow Leaf -->
  <!-- Scaled up perfectly to fit inside the 512 viewBox (original was 24x24) -->
  <g transform="translate(106, 106) scale(12.5)">
    <!-- Glow effect behind the leaf -->
    <path 
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10ZM2 22 12 12" 
      stroke="#10B981" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.3"
      filter="blur(6px)"
    />
    
    <!-- Main crisp Leaf path -->
    <path 
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" 
      stroke="url(#leaf-gradient)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <path 
      d="M2 22 12 12" 
      stroke="url(#leaf-gradient)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <defs>
    <!-- Dark deep background gradient -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1825"/> <!-- Soft charcoal matching Sidebar -->
      <stop offset="100%" stop-color="#09080E"/> <!-- Deep black-violet -->
    </linearGradient>
    
    <!-- Glass border reflection (brighter top-left, fades out) -->
    <linearGradient id="border-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#2A2640" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Vibrant Emerald Leaf Gradient -->
    <linearGradient id="leaf-gradient" x1="2" y1="22" x2="19" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/> <!-- Emerald 500 -->
      <stop offset="100%" stop-color="#34D399"/> <!-- Emerald 400 (brighter tip) -->
    </linearGradient>
  </defs>
</svg>
