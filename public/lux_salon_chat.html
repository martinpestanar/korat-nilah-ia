<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lux Salon - Demo</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        h1 { color: #1f2937; }
        p { color: #4b5563; }

        /* PERSONALIZACIÓN DEL CHAT (Hacerlo más grande) */
        .woot-widget-holder {
            width: 450px !important;      /* Ancho más grande (Default es ~360px) */
            height: 700px !important;     /* Alto más grande (Default es ~560px) */
            max-height: 85vh !important;  /* Máximo 85% de la altura de la pantalla */
            box-shadow: 0 8px 30px rgba(0,0,0,0.15) !important;
            border-radius: 16px !important;
            overflow: hidden !important;
        }

        /* Ajuste para móviles: Ocupar toda la pantalla */
        @media (max-width: 668px) {
            .woot-widget-holder {
                width: 100% !important;
                height: 100% !important;
                max-height: 100% !important;
                right: 0 !important;
                bottom: 0 !important;
                top: 0 !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lux Salon - Demo Chat</h1>
        <p>El widget de chat debería aparecer en la esquina inferior derecha, más grande de lo normal.</p>
    </div>

    <!-- CHATWOOT SCRIPT -->
    <script>
      (function(d,t) {
        var BASE_URL="https://chat.koratflow.agency";
        var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
        g.src=BASE_URL+"/packs/js/sdk.js";
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g,s);
        g.onload=function(){
          window.chatwootSDK.run({
            websiteToken: 'E8fVo98Mg6ehdQVekyQZtoxb', // Token de Lux Salon
            baseUrl: BASE_URL
          })
        }
      })(document,"script");
    </script>

</body>
</html>
