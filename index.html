<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nilah IA | Dashboard Inteligente</title>
  <meta name="description"
    content="Dashboard de CRM y Marketing WhatsApp con Inteligencia Artificial para salones de belleza" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Detectar tema inicial ANTES de que cargue la página (evita flash)
    (function () {
      const savedMode = localStorage.getItem('korat-theme-mode');
      let theme = 'light';

      if (savedMode === 'dark') {
        theme = 'dark';
      } else if (savedMode === 'light') {
        theme = 'light';
      } else {
        // Auto: basado en hora
        const hour = new Date().getHours();
        theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
      }

      document.documentElement.classList.add(theme);
    })();

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // === PALETA NILAH IA — Violet & Pink ===
            primary: {
              DEFAULT: '#8B5CF6', // Violet-500 — signature Nilah
              light: '#A78BFA',   // Violet-400
              dark: '#7C3AED',    // Violet-600
              dim: '#9575F5',
            },
            accent: {
              DEFAULT: '#EC4899', // Pink-500
              light: '#F472B6',   // Pink-400
              dark: '#DB2777',    // Pink-600
            },
            // Modo Oscuro — profundo con matiz violeta
            dark: {
              bg: '#09090B',      // Zinc-950
              card: '#131318',    // Tinted dark
              text: '#ECEDEE',    // Cool white
              border: '#23232D',  // Violet-tinted border
              muted: '#8B8B9E',   // Muted violet-gray
            },
            // Modo Claro — cool & clean
            light: {
              bg: '#FAFAFB',      // Cool near-white
              card: '#FFFFFF',
              text: '#18181B',    // Zinc-900
              border: '#E4E4EC',  // Soft violet-gray
              muted: '#6B7280',   // Gray-500
              sidebar: '#13111C', // Deep violet-black
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'premium': '0 4px 20px -2px rgba(139, 92, 246, 0.15)',
            'premium-lg': '0 10px 40px -10px rgba(139, 92, 246, 0.25)',
          }
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrollbar para modo oscuro */
    .dark ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .dark ::-webkit-scrollbar-track {
      background: #09090B;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #23232D;
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #8B5CF6;
    }

    /* Scrollbar para modo claro */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #FAFAFB;
    }

    ::-webkit-scrollbar-thumb {
      background: #E4E4EC;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #8B5CF6;
    }

    /* Transición suave de tema */
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Skeleton Shimmer Animation */
    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    /* Pulse animation for real-time indicator */
    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.1);
      }
    }

    /* Slide up animation */
    @keyframes slideUp {
      from {
        transform: translateY(10px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Bounce subtle animation */
    @keyframes bounce-subtle {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    /* Success ripple animation */
    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }

      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    /* Confetti fall animation */
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100px) rotate(720deg);
        opacity: 0;
      }
    }

    /* Send/fly animation */
    @keyframes fly {
      0% {
        transform: translateX(0) translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateX(100px) translateY(-100px) rotate(45deg);
        opacity: 0;
      }
    }

    /* Utility classes for animations */
    .animate-shimmer {
      animation: shimmer 2s infinite;
    }

    .animate-pulse-dot {
      animation: pulse-dot 2s ease-in-out infinite;
    }

    .animate-slide-up {
      animation: slideUp 0.3s ease-out;
    }

    .animate-bounce-subtle {
      animation: bounce-subtle 0.6s ease-in-out;
    }

    /* ========================================
       LANDING PAGE ANIMATIONS 
       ======================================== */

    /* Fade in from bottom */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fade in general */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Slide in from left */
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Slide in from right */
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Scale in (zoom) */
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Floating animation for elements */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Glow pulse for CTAs */
    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
      }

      50% {
        box-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
      }
    }

    /* Stagger animation delays */
    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out both;
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out both;
    }

    .animate-slide-in-left {
      animation: slideInLeft 0.6s ease-out both;
    }

    .animate-slide-in-right {
      animation: slideInRight 0.6s ease-out both;
    }

    .animate-scale-in {
      animation: scaleIn 0.5s ease-out both;
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .animate-glow-pulse {
      animation: glowPulse 2s ease-in-out infinite;
    }

    /* Animation delays for staggered effects */
    .delay-100 {
      animation-delay: 0.1s;
    }

    .delay-200 {
      animation-delay: 0.2s;
    }

    .delay-300 {
      animation-delay: 0.3s;
    }

    .delay-400 {
      animation-delay: 0.4s;
    }

    .delay-500 {
      animation-delay: 0.5s;
    }

    .delay-600 {
      animation-delay: 0.6s;
    }

    .delay-700 {
      animation-delay: 0.7s;
    }

    /* Glassmorphism for landing */
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .dark .glass-card {
      background: rgba(20, 20, 20, 0.8);
    }

    /* Gradient text helper */
    .text-gradient-violet {
      background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Enhanced button hover effect */
    .btn-cta-primary {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-cta-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .btn-cta-primary:hover::after {
      transform: translateX(100%);
    }
  </style>
</head>

<body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
