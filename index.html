<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nilah IA" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json?v=2" />
  <title>Nilah IA | Dashboard Inteligente</title>
  <meta name="description"
    content="Dashboard de CRM y Marketing WhatsApp con Inteligencia Artificial para salones de belleza" />
  <script>
    // Detectar tema inicial ANTES de que cargue la página (evita flash)
    (function () {
      const savedMode = localStorage.getItem('korat-theme-mode');
      let theme = 'light';

      if (savedMode === 'dark') {
        theme = 'dark';
      } else if (savedMode === 'light') {
        theme = 'light';
      } else {
        // Auto: basado en hora
        const hour = new Date().getHours();
        theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
      }

      document.documentElement.classList.add(theme);
    })();

    // --- URL NORMALIZER (Hash Bridge) ---
    // Si entran a /god-mode sin el #, redirigir a /#/god-mode
    // Esto previene que Safari móvil mande al home cuando omiten el hash
    (function () {
      const pathname = window.location.pathname;
      const search = window.location.search;
      if (pathname !== '/' && pathname !== '/index.html' && !window.location.hash) {
        window.location.replace('/#' + pathname + search);
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ================================================
       APP SHELL — Body y Root completamente estáticos.
       SOLO el <main> interno tiene overflow/scroll.
       Esto es lo que da la sensación de app nativa iOS.
       ================================================ */
    html {
      /* Fallback para Safari iOS < 15 */
      height: -webkit-fill-available;
      /* dvh = dynamic viewport height (excluye barra de Safari) */
      height: 100dvh;
      /* Prevenir bounce elástico indeseado iOS en el root */
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      height: -webkit-fill-available;
      height: 100dvh;
      overflow: hidden;
      /* Touch action natural para el scroll */
      touch-action: pan-y;
    }

    #root {
      height: -webkit-fill-available;
      height: 100dvh;
      overflow: hidden;
    }

    /* Safe-area variables para notch / Dynamic Island */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    /* Scrollbar para modo oscuro */
    .dark ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .dark ::-webkit-scrollbar-track {
      background: #09090B;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #23232D;
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #8B5CF6;
    }

    /* Scrollbar para modo claro */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #FAFAFB;
    }

    ::-webkit-scrollbar-thumb {
      background: #E4E4EC;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #8B5CF6;
    }

    /* Transición suave de tema */
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Skeleton Shimmer Animation */
    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    /* Pulse animation for real-time indicator */
    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.1);
      }
    }

    /* Slide up animation */
    @keyframes slideUp {
      from {
        transform: translateY(10px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Bounce subtle animation */
    @keyframes bounce-subtle {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    /* Success ripple animation */
    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }

      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    /* Confetti fall animation */
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100px) rotate(720deg);
        opacity: 0;
      }
    }

    /* Send/fly animation */
    @keyframes fly {
      0% {
        transform: translateX(0) translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateX(100px) translateY(-100px) rotate(45deg);
        opacity: 0;
      }
    }

    /* Utility classes for animations */
    .animate-shimmer {
      animation: shimmer 2s infinite;
    }

    .animate-pulse-dot {
      animation: pulse-dot 2s ease-in-out infinite;
    }

    .animate-slide-up {
      animation: slideUp 0.3s ease-out;
    }

    .animate-bounce-subtle {
      animation: bounce-subtle 0.6s ease-in-out;
    }

    /* ========================================
       LANDING PAGE ANIMATIONS 
       ======================================== */

    /* Fade in from bottom */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fade in general */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Slide in from left */
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Slide in from right */
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Scale in (zoom) */
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Floating animation for elements */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Glow pulse for CTAs */
    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
      }

      50% {
        box-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
      }
    }

    /* Stagger animation delays */
    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out both;
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out both;
    }

    .animate-slide-in-left {
      animation: slideInLeft 0.6s ease-out both;
    }

    .animate-slide-in-right {
      animation: slideInRight 0.6s ease-out both;
    }

    .animate-scale-in {
      animation: scaleIn 0.5s ease-out both;
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .animate-glow-pulse {
      animation: glowPulse 2s ease-in-out infinite;
    }

    /* Animation delays for staggered effects */
    .delay-100 {
      animation-delay: 0.1s;
    }

    .delay-200 {
      animation-delay: 0.2s;
    }

    .delay-300 {
      animation-delay: 0.3s;
    }

    .delay-400 {
      animation-delay: 0.4s;
    }

    .delay-500 {
      animation-delay: 0.5s;
    }

    .delay-600 {
      animation-delay: 0.6s;
    }

    .delay-700 {
      animation-delay: 0.7s;
    }

    /* Glassmorphism for landing */
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .dark .glass-card {
      background: rgba(20, 20, 20, 0.8);
    }

    /* Gradient text helper */
    .text-gradient-violet {
      background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Enhanced button hover effect */
    .btn-cta-primary {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-cta-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .btn-cta-primary:hover::after {
      transform: translateX(100%);
    }

    /* ========================================
       NEW: SVG Draw-in / Stroke Animation
       ======================================== */
    @keyframes drawIn {
      from {
        stroke-dashoffset: 1000;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .animate-draw-in {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawIn 2s ease-out forwards;
    }

    /* Circuit path pulse (for data-flow lines) */
    @keyframes circuitPulse {
      0% {
        stroke-dashoffset: 200;
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }

      100% {
        stroke-dashoffset: -200;
        opacity: 0.3;
      }
    }

    .animate-circuit-pulse {
      stroke-dasharray: 20 30;
      animation: circuitPulse 3s linear infinite;
    }

    /* Glow trace for circuit lines */
    @keyframes glowTrace {
      0% {
        stroke-dashoffset: 600;
        filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.4));
      }

      50% {
        filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.8));
      }

      100% {
        stroke-dashoffset: -600;
        filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.4));
      }
    }

    .animate-glow-trace {
      stroke-dasharray: 40 60;
      animation: glowTrace 4s ease-in-out infinite;
    }

    /* ========================================
       NEW: Floating Reaction Bubbles
       ======================================== */
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      60% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-120px) scale(0.6);
        opacity: 0;
      }
    }

    .animate-float-up {
      animation: floatUp 3s ease-out infinite;
    }

    /* Staggered bubble delays */
    .bubble-delay-1 {
      animation-delay: 0s;
    }

    .bubble-delay-2 {
      animation-delay: 0.8s;
    }

    .bubble-delay-3 {
      animation-delay: 1.6s;
    }

    .bubble-delay-4 {
      animation-delay: 2.4s;
    }

    .bubble-delay-5 {
      animation-delay: 3.2s;
    }

    /* ========================================
       NEW: Dashboard Widget Entrance
       ======================================== */
    @keyframes widgetSlideUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-widget-enter {
      animation: widgetSlideUp 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    /* Staggered widget entrance */
    .widget-delay-1 {
      animation-delay: 0.05s;
    }

    .widget-delay-2 {
      animation-delay: 0.1s;
    }

    .widget-delay-3 {
      animation-delay: 0.15s;
    }

    .widget-delay-4 {
      animation-delay: 0.2s;
    }

    .widget-delay-5 {
      animation-delay: 0.25s;
    }

    .widget-delay-6 {
      animation-delay: 0.3s;
    }

    /* ========================================
       NEW: Counter / Number Grow
       ======================================== */
    @keyframes numberPop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      60% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-number-pop {
      animation: numberPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* ========================================
       NEW: Card Hover Lift (Mobile Tap)
       ======================================== */
    .tap-feedback {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tap-feedback:active {
      transform: scale(0.97) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
    }

    /* ========================================
       NEW: Parallax Tilt (Mouse-reactive)
       ======================================== */
    .perspective-container {
      perspective: 1000px;
    }

    .tilt-card {
      transition: transform 0.3s ease-out;
      transform-style: preserve-3d;
    }

    /* ========================================
       NEW: Wireframe Sphere Rotation
       ======================================== */
    @keyframes rotateSphere {
      from {
        transform: rotateY(0deg) rotateX(15deg);
      }

      to {
        transform: rotateY(360deg) rotateX(15deg);
      }
    }

    .animate-sphere-rotate {
      animation: rotateSphere 20s linear infinite;
    }

    /* ========================================
       NEW: Morphing Gradient Blob
       ======================================== */
    @keyframes morphBlob {
      0% {
        border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%;
      }

      25% {
        border-radius: 50% 50% 30% 70% / 40% 60% 40% 60%;
      }

      50% {
        border-radius: 30% 70% 50% 50% / 60% 40% 60% 40%;
      }

      75% {
        border-radius: 60% 40% 40% 60% / 30% 70% 40% 60%;
      }

      100% {
        border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%;
      }
    }

    .animate-morph-blob {
      animation: morphBlob 8s ease-in-out infinite;
    }

    /* ========================================
       NEW: Pulse Ring (for active indicators)
       ======================================== */
    @keyframes pulseRing {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }

      100% {
        transform: scale(2.5);
        opacity: 0;
      }
    }

    .animate-pulse-ring {
      animation: pulseRing 1.5s ease-out infinite;
    }

    /* ========================================
       NEW: Page Transition (Fade Slide)
       ======================================== */
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-page-enter {
      animation: pageEnter 0.3s ease-out both;
    }

    /* ========================================
       NILAH AVATAR ANIMATIONS
       ======================================== */
    @keyframes nilahTalk {

      0%,
      100% {
        transform: scaleY(1);
      }

      25% {
        transform: scaleY(0.3);
      }

      50% {
        transform: scaleY(0.8);
      }

      75% {
        transform: scaleY(0.2);
      }
    }

    @keyframes nilahJump {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      20% {
        transform: translateY(-18px) rotate(-3deg);
      }

      40% {
        transform: translateY(-22px) rotate(3deg);
      }

      60% {
        transform: translateY(-10px) rotate(-2deg);
      }

      80% {
        transform: translateY(-4px) rotate(1deg);
      }
    }

    @keyframes nilahIdle {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      33% {
        transform: translateY(-5px) rotate(0.5deg);
      }

      66% {
        transform: translateY(-3px) rotate(-0.5deg);
      }
    }

    @keyframes nilahBlink {

      0%,
      90%,
      100% {
        transform: scaleY(1);
      }

      95% {
        transform: scaleY(0.1);
      }
    }

    @keyframes countUp {
      from {
        transform: translateY(8px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes confettiPiece {
      0% {
        transform: translateY(-10px) rotate(0deg) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateY(120px) rotate(720deg) scale(0.5);
        opacity: 0;
      }
    }

    @keyframes starburstIn {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.2) rotate(10deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes slideFromRight {
      from {
        transform: translateX(30px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideFromLeft {
      from {
        transform: translateX(-30px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes streakFire {

      0%,
      100% {
        transform: scaleY(1) scaleX(1);
        filter: hue-rotate(0deg);
      }

      25% {
        transform: scaleY(1.1) scaleX(0.95);
        filter: hue-rotate(-10deg);
      }

      75% {
        transform: scaleY(0.95) scaleX(1.05);
        filter: hue-rotate(10deg);
      }
    }

    .animate-nilah-talk {
      animation: nilahTalk 0.25s ease-in-out infinite;
    }

    .animate-nilah-jump {
      animation: nilahJump 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .animate-nilah-idle {
      animation: nilahIdle 3s ease-in-out infinite;
    }

    .animate-nilah-blink {
      animation: nilahBlink 3s ease-in-out infinite;
    }

    .animate-count-up {
      animation: countUp 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    .animate-confetti-piece {
      animation: confettiPiece 1.5s ease-out both;
    }

    .animate-starburst {
      animation: starburstIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .animate-from-right {
      animation: slideFromRight 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    .animate-from-left {
      animation: slideFromLeft 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    .animate-streak-fire {
      animation: streakFire 1.5s ease-in-out infinite;
    }

    /* ========================================
       PERFORMANCE: Reduced Motion
       ======================================== */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
